<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Esports Tournament Manager</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main class="container">
  <h1>Leaderboard</h1>

  <section class="card">
    <h2>Team standings</h2>
    <div class="field" style="max-width:360px">
      <label for="standingsTournament">Tournament</label>
      <select id="standingsTournament"></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Team</th><th>Played</th><th>Wins</th><th>Losses</th><th>Points</th></tr></thead>
        <tbody id="standingsRows"><tr><td colspan="6">Select a tournament.</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Player K/D/A ranking</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Player</th><th>Kills</th><th>Deaths</th><th>Assists</th><th>K/D</th><th>Matches</th></tr></thead>
        <tbody id="playerStatRows2"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">Full Stack Development Mini Project · SIT Pune</footer>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/leaderboard.js"></script>
</body>
</html>
