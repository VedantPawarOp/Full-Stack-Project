<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches - Esports Tournament Manager</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main class="container">
  <h1>Matches</h1>

  <section class="card">
    <div class="field" style="max-width:360px">
      <label for="tournamentFilter">Tournament</label>
      <select id="tournamentFilter"></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Round</th><th>Team 1</th><th>Team 2</th><th>Status</th><th>Score</th><th></th></tr></thead>
        <tbody id="matchRows"><tr><td colspan="7">Select a tournament.</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card hidden" id="matchDetailCard">
    <h2 id="matchTitle"></h2>
    <div id="matchActions"></div>

    <form id="resultForm" class="hidden">
      <div class="grid cols-2">
        <div class="field">
          <label for="score1">Team 1 score</label>
          <input type="number" id="score1" min="0" required>
        </div>
        <div class="field">
          <label for="score2">Team 2 score</label>
          <input type="number" id="score2" min="0" required>
        </div>
      </div>
      <h3>Player stats (K/D/A)</h3>
      <div id="playerStatRows"></div>
      <button type="submit">Record result</button>
    </form>
  </section>
</main>

<footer class="site-footer">Full Stack Development Mini Project · SIT Pune</footer>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/matches.js"></script>
</body>
</html>
