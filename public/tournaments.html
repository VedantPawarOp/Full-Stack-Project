<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournaments - Esports Tournament Manager</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main class="container">
  <h1>Tournaments</h1>

  <section class="card" id="createTournamentCard">
    <h2>Create a tournament</h2>
    <form id="createTournamentForm" novalidate>
      <div class="grid cols-2">
        <div class="field">
          <label for="tName">Name</label>
          <input type="text" id="tName" name="name" data-validate="required" required>
          <small class="error" data-error-for="name"></small>
        </div>
        <div class="field">
          <label for="tGame">Game</label>
          <select id="tGame" name="gameId" required></select>
        </div>
        <div class="field">
          <label for="tMaxTeams">Max teams (4-32)</label>
          <input type="number" id="tMaxTeams" name="maxTeams" min="4" max="32" value="8" required>
        </div>
        <div class="field">
          <label for="tFee">Entry fee</label>
          <input type="number" id="tFee" name="entryFee" min="0" value="0">
        </div>
        <div class="field">
          <label for="tRegOpen">Registration opens</label>
          <input type="date" id="tRegOpen" name="regOpen" required>
        </div>
        <div class="field">
          <label for="tRegClose">Registration closes</label>
          <input type="date" id="tRegClose" name="regClose" required>
        </div>
        <div class="field">
          <label for="tStart">Start date</label>
          <input type="date" id="tStart" name="startDate" required>
        </div>
        <div class="field">
          <label for="tEnd">End date</label>
          <input type="date" id="tEnd" name="endDate" required>
        </div>
      </div>
      <button type="submit">Create tournament</button>
    </form>
  </section>

  <section class="card">
    <h2>All tournaments</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Game</th><th>Status</th><th>Teams</th><th></th></tr></thead>
        <tbody id="tournamentRows"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card hidden" id="detailCard">
    <h2 id="detailName"></h2>
    <p id="detailMeta"></p>
    <div id="organizerControls"></div>

    <h3>Registered teams</h3>
    <ul id="registrationList"></ul>

    <div class="field" id="registerTeamField" style="max-width:320px">
      <label for="registerTeamSelect">Register your team</label>
      <select id="registerTeamSelect"></select>
      <button type="button" id="registerTeamBtn" class="secondary">Register</button>
    </div>

    <h3>Bracket</h3>
    <div class="bracket" id="bracketView"><p>Bracket not generated yet.</p></div>
  </section>
</main>

<footer class="site-footer">Full Stack Development Mini Project · SIT Pune</footer>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/js/api.js"></script>
<script src="/js/validation.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/tournaments.js"></script>
</body>
</html>
